name: Data4Diabetes
description: Data4Diabetes App
publish_to: none
version: 2025.12.1+45

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.4
  get: ^4.6.6
  flutter_svg: ^2.2.1
  dio: ^5.9.0
  shared_preferences: ^2.0.10
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cached_network_image: ^3.2.0
  animations: ^2.0.2
  logger: ^2.6.2
  pretty_dio_logger: ^1.1.1
  font_awesome_flutter: ^10.9.1
  fluttertoast: ^9.0.0
  d_chart: 2.2.11
  flutter_screenutil: 5.9.3
  mobile_scanner: ^7.1.2
  package_info_plus: ^8.3.0
  intl_phone_number_input: ^0.7.4
  sms_autofill: ^2.4.0
  webview_flutter: ^4.4.2
  http: ^1.5.0
  page_view_dot_indicator: ^2.1.0
  dropdown_button2: ^2.1.0
  syncfusion_flutter_charts: ^31.1.19
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2
  firebase_crashlytics: ^5.0.2  # your existing one
  firebase_analytics: ^12.0.2   # if you use analytics
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  analyzer: any
  dart_code_metrics: any
  change_app_package_name: ^1.0.0
  flutter_launcher_icons: ^0.14.4



flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "images/launcher_icon_new.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - images/
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Thin.ttf
          weight: 200
        - asset: fonts/Roboto-Light.ttf
          weight: 200
        - asset: fonts/Roboto-Regular.ttf
          weight: 200
        - asset: fonts/Roboto-Medium.ttf
          weight: 300
        - asset: fonts/Roboto-Bold.ttf
          weight: 600
        - asset: fonts/Roboto-Italic.ttf
          style: italic
